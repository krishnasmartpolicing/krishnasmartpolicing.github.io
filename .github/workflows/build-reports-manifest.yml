# Auto-rebuilds reports/manifest.json whenever you add/replace a file in reports/.
# Runs on BOTH main and master so it works regardless of which branch GitHub
# Pages serves from. To publish a report: drop the file into reports/ and commit.
name: Build reports manifest

on:
  push:
    branches: [ main, master ]
    paths:
      - 'reports/**'

permissions:
  contents: write

concurrency:
  group: build-reports-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so commit dates can be read

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate reports/manifest.json
        run: python make_reports_manifest.py

      - name: Commit manifest if it changed
        run: |
          if ! git diff --quiet -- reports/manifest.json; then
            git config user.name  "manifest-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/manifest.json
            git commit -m "Auto-update reports manifest [skip ci]"
            git push
          else
            echo "reports/manifest.json already up to date — nothing to commit."
          fi
