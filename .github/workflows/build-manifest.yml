# Auto-rebuilds data/weeks/manifest.json whenever you add/replace a weekly file.
# Result: to publish a new week you ONLY upload the Excel into data/weeks/ and commit.
# The manifest updates itself, then GitHub Pages redeploys and all viewers see it.
name: Build weeks manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'data/weeks/**.xlsx'
      - 'data/weeks/**.xls'
      - 'data/weeks/**.csv'

permissions:
  contents: write

concurrency:
  group: build-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate manifest.json from files in data/weeks/
        run: python make_manifest.py

      - name: Commit manifest if it changed
        run: |
          if ! git diff --quiet -- data/weeks/manifest.json; then
            git config user.name  "manifest-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/weeks/manifest.json
            git commit -m "Auto-update weeks manifest [skip ci]"
            git push
          else
            echo "manifest.json already up to date — nothing to commit."
          fi
